#!/usr/bin/env python3

PACKAGE = "hero_chassis_controller"

from dynamic_reconfigure.parameter_generator_catkin import *

gen = ParameterGenerator()

for wheel in ("left_front", "right_front", "left_back", "right_back"):
    gen.add(wheel + "_kp", double_t, 0, "Proportional gain", 2.0, 0.0, 100.0)
    gen.add(wheel + "_ki", double_t, 0, "Integral gain", 0.1, 0.0, 100.0)
    gen.add(wheel + "_kd", double_t, 0, "Derivative gain", 0.0, 0.0, 100.0)
    gen.add(wheel + "_i_clamp", double_t, 0, "Integral contribution limit", 2.0, 0.0, 50.0)

exit(gen.generate(PACKAGE, "hero_chassis_controller", "HeroChassisController"))
