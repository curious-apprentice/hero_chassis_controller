#!/usr/bin/env python3

PACKAGE = "hero_chassis_controller"

from dynamic_reconfigure.parameter_generator_catkin import *

gen = ParameterGenerator()

for wheel in ("left_front", "right_front", "left_back", "right_back"):
    gen.add(wheel + "_kp", double_t, 0, "Proportional gain for this wheel", 2.0, 0.0, 100.0)
    gen.add(wheel + "_ki", double_t, 0, "Integral gain for this wheel", 0.1, 0.0, 100.0)
    gen.add(wheel + "_kd", double_t, 0, "Derivative gain for this wheel", 0.0, 0.0, 100.0)
    gen.add(wheel + "_i_clamp", double_t, 0, "Absolute integral output limit", 2.0, 0.0, 50.0)

gen.add("global_frame_mode", bool_t, 0,
"Interpret planar cmd_vel in global_frame_id instead of base_link", False)


exit(gen.generate(PACKAGE, "hero_chassis_controller", "HeroChassisController"))
